# Temporary: renders every Settings page (Debug build, `--snapshot-settings`)
# before and after this branch's redesign on a GitHub-hosted Mac, and commits
# the PNGs to the branch for the pull request. Removed again before merge.
name: Settings screenshots

on:
  pull_request:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.head_ref == 'claude/project-thread-ekcf3y'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Trust package plugins and macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Render after
        run: |
          xcodegen generate
          xcodebuild -project Verbatim.xcodeproj -scheme Verbatim -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$HOME/dd" -quiet build
          .github/render-settings.sh "$PWD/docs/screenshots/settings/after"

      - name: Render before (main's Settings view)
        run: |
          git checkout origin/main -- Verbatim/UI/Settings/SettingsView.swift
          xcodebuild -project Verbatim.xcodeproj -scheme Verbatim -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$HOME/dd" -quiet build
          .github/render-settings.sh "$PWD/docs/screenshots/settings/before"
          git checkout HEAD -- Verbatim/UI/Settings/SettingsView.swift

      - name: Commit to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots/settings
          git diff --cached --quiet && exit 0
          git commit -m "Render Settings screenshots on CI"
          git push origin "HEAD:${{ github.head_ref }}"
