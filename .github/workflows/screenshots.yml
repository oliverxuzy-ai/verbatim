# Temporary: renders the app's own views with sample data (Debug build,
# `--snapshot`) on a GitHub-hosted Mac and commits the PNGs to this PR's
# branch for the README. Removed again before merge.
name: Screenshots

on:
  pull_request:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.head_ref == 'claude/project-thread-pq0bcj'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Trust package plugins and macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build (Debug)
        run: |
          xcodegen generate
          xcodebuild -project Verbatim.xcodeproj -scheme Verbatim -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$HOME/dd" -quiet build

      - name: Render screenshots
        env:
          # Sample meetings are placed around "now"; render them at mid-afternoon.
          TZ: Pacific/Honolulu
        run: |
          out="$PWD/docs/screenshots"
          rm -rf "$out" && mkdir -p "$out"
          "$HOME/dd/Build/Products/Debug/Verbatim.app/Contents/MacOS/Verbatim" --snapshot "$out" &
          pid=$!
          for _ in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          find "$out" -name '*.png' ! -name 'main-live-light.png' ! -name 'main-today-light.png' \
            ! -name 'verbatim-*.png' ! -name 'menubar-idle-*.png' ! -name 'panel-*.png' -delete
          ls -la "$out"

      - name: Commit to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Render screenshots at 2x on CI"
          git push origin "HEAD:${{ github.head_ref }}"
