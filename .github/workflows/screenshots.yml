# Temporary: renders every Settings page (Debug build, `--snapshot-settings`)
# on a GitHub-hosted Mac and commits the PNGs to this branch, for before/after
# screenshots in the pull request. Removed again before merge.
name: Settings screenshots

on:
  push:
    branches: [claude/project-thread-ekcf3y]

permissions:
  contents: write

concurrency:
  group: settings-screenshots
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Trust package plugins and macros
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build (Debug)
        run: |
          xcodegen generate
          xcodebuild -project Verbatim.xcodeproj -scheme Verbatim -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$HOME/dd" -quiet build

      - name: Render Settings
        env:
          LABEL: ${{ contains(github.event.head_commit.message, '[snap-before]') && 'before' || 'after' }}
        run: |
          out="$PWD/docs/screenshots/settings/$LABEL"
          rm -rf "$out" && mkdir -p "$out"
          "$HOME/dd/Build/Products/Debug/Verbatim.app/Contents/MacOS/Verbatim" --snapshot-settings "$out" &
          pid=$!
          for _ in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la "$out"

      - name: Commit to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots/settings
          git diff --cached --quiet && exit 0
          git commit -m "Render Settings screenshots on CI"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done
